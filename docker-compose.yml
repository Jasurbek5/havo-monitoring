name: havo-monitoring

# Hamma backend servislari bitta image'dan ishlaydi, faqat buyruq (command) farq qiladi.
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    # .env dagi lokal qiymatlarni konteyner ichidagi manzillar bilan almashtiramiz
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-havo}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-havo}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    MEDIA_DIR: /data/media
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-havo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-havo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Bir martalik: migratsiyalar va hududlar ro'yxati. Tugagach api/worker/beat ishga tushadi.
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # FastAPI. BOT_MODE=polling bo'lsa bot ham shu jarayon ichida ishlaydi (bitta nusxa!).
  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media:/data/media
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Celery worker: havo ma'lumotini olish, ogohlantirishlar, ertalabki xabar
  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery beat: jadval bo'yicha vazifalarni ishga tushiradi (faqat BITTA nusxa bo'lishi kerak)
  beat:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Faqat server uchun: docker compose --profile prod up -d
  nginx:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:

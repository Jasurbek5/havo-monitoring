[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# backend/alembic/ papkasi bor, lekin "alembic" bu kutubxona
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"app/core/locales/*.py" = ["E501"]
"app/db/seed_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

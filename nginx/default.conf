# Reverse proxy. Telegram webhook faqat HTTPS orqali ishlaydi, shuning uchun serverda
# TLS sertifikat kerak (masalan, certbot --nginx yoki Caddy/Cloudflare oldida).
# Keyingi bosqichda "/" ga React dashboard (statik fayllar) qo'shiladi.

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /telegram/webhook {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

